name: Test diagnostics (win)
on:
  pull_request:
  push:
    branches:
      - ros2
  schedule:
    # Run every week at 20:00 on Sunday
    - cron: "0 20 * * 0"

jobs:
  build_and_test_win:
    name: ${{ matrix.package }} on ${{ matrix.os }} under ${{ matrix.distro }}
    strategy:
      fail-fast: false
      matrix:
        package: [
            # diagnostic_aggregator,
            # diagnostic_common_diagnostics,
            # diagnostic_remote_logging,
            diagnostic_updater,
            # self_test,
          ]
        # distro: [rolling]
        distro: [humble, jazzy, kilted, rolling]
        os: [
          # macOS-latest,
          windows-2022
        ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: ros-tooling/setup-ros@0.7.15
        with:
          required-ros-distributions: ${{ matrix.distro }}
      - name: Upgrade colcon-meson
      # Workaround for "Exception in package identification extension 'meson' in 'src\ohkszihoidm': __init__() missing 2 required positional arguments: 'subproject_dir' and 'env'"
        run: |
          python -m pip install -U \
            colcon-meson==0.5.0  
      - uses: ros-tooling/action-ros-ci@0.4.5
        with:
          target-ros2-distro: ${{ matrix.distro }}
          package-name: ${{ matrix.package }}
